# tmux in a guest, where agent-methodology's agents run on workmux in session `agents` (README, *fleet*): the
# gruvbox look of ../tmux/tmux.conf on tmux's own keys (prefix C-b, the agents' and agent-methodology's C-b u),
# windows from 0 (fleet's `dashboard` first). nixed links it as each guest's ~/.config/tmux/tmux.conf (nixed#45).

# True color (alacritty's TERM is `alacritty`; a recent tmux asks the terminal anyway)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features ",alacritty*:RGB"

# The dashboard takes clicks: tmux passes them on only with the mouse on
set -g mouse on
setw -g mode-keys vi

# workmux's own views: its dashboard in a popup over the window (prefix C-s), its sidebar, a column in every window,
# on and off (prefix C-t). The keys are workmux's docs'. agent-methodology turns the sidebar on when it starts the server
bind C-s display-popup -w 90% -h 80% -E "workmux dashboard"
bind C-t run-shell "workmux sidebar"

# Palette: bg #282828, bg1 #3c3836, bg2 #504945, fg #ebdbb2, light2 #d5c4a1, light0 #fbf1c7, grey #928374,
# yellow #fabd2f, blue #83a598, faded purple #8f3f71.
set -g status-interval 5
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 60
# The host the guest runs on (nixos, thinkcentre), on a dimmed dark purple: nixed's AGENT_LOCATION ("guest <name> on
# host <host>; ..."), read once as the config loads; else the guest's own name. agent-methodology puts its UNATTENDED
# block before this, on the session, and lengthens it.
run-shell 'h=$(printf %s "${AGENT_LOCATION:-}" | sed -n "s/.* on host \([^;]*\).*/\1/p"); [ -z "$h" ] || tmux set -g @guest_host "$h"'
set -g status-left "#[bg=#8f3f71,fg=#ebdbb2] #{?@guest_host,#{@guest_host},#{host_short}} #[default] "
set -g status-right "#[fg=#928374]%Y-%m-%d %H:%M "
# Tabs: a dim number, the window name in light grey (the current one bold and lighter), workmux's branch
# glyph (Nerd Font's U+F418, its window prefix under `nerdfont: true`) before an agent's name dim like the number (the
# prefix keeps workmux's names its own: with none, `workmux open` takes any window named like the worktree for the
# agent's), then workmux's status icon (an emoji: 🤖 working, 💬 waiting, ✅ done).
# workmux copies this format into each agent's window at its first status update and puts the icon before the
# `#{?window_flags,,}` piece, which shows nothing itself (its `status_format`, tried with workmux 0.1.284); without
# that piece the icon would go at the very end.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#928374] #I #{?#{m: *,#{window_name}}, #[fg=#d5c4a1]#{s/^ //:window_name},#[fg=#d5c4a1]#W}#{?window_zoomed_flag, +,}#{?window_flags,,} "
setw -g window-status-current-format "#[bg=#504945,fg=#928374] #I #{?#{m: *,#{window_name}}, #[fg=#fbf1c7#,bold]#{s/^ //:window_name},#[fg=#fbf1c7#,bold]#W}#{?window_zoomed_flag, +,}#{?window_flags,,} "
setw -g window-status-style default
setw -g window-status-current-style default
setw -g window-status-activity-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#ebdbb2"
setw -g clock-mode-colour "#83a598"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"
