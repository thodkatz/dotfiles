# Charge thresholds for the ThinkPad X1's battery: keeping it at 100% on the charger wears it out,
# so charging starts only below 75% and stops at 80%. On the charger the laptop runs off AC either way.
# Before a trip: `sudo tlp fullcharge` charges to 100% once; the thresholds return on the next boot
# (or `sudo tlp setcharge`).
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
