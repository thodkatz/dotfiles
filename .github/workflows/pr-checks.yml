name: PR checks
# Mechanical workflow rules: slice size, spec approval, clarification status, carried-forward text.
# The checks are thodkatz/agent-action's pr-checks action; see .methodology/shared/guides/development-workflow.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read
jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: thodkatz/agent-action/pr-checks@main
        with:
          max_lines: "1000"       # lines of code (not tests or docs) over which the size is a warning
          hard_max_lines: "3000"  # over which it fails without the large-slice label
          exclude: ""  # generated files, e.g. "tests/fixtures/*,*.snap"
          # reads agent-methodology for the blocks check; without the secret that check is skipped with a notice
          methodology_token: ${{ secrets.AGENT_METHODOLOGY_TOKEN }}
