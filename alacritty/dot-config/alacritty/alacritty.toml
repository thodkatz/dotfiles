[window]
decorations = "None"
dynamic_padding = true
padding = { x = 10, y = 10 }

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[font]
size = 14

[font.bold]
family = "Inconsolata"
style = "Bold"

[font.bold_italic]
family = "Inconsolata"
style = "Bold Italic"

[font.italic]
family = "Inconsolata"
style = "Italic"

[font.normal]
family = "Inconsolata"
style = "Regular"

# Tokyo Night, on its darkest background
[colors.primary]
background = "#16161e"
foreground = "#c0caf5"

[colors.cursor]
text = "#16161e"
cursor = "#c0caf5"

[colors.selection]
text = "CellForeground"
background = "#33467c"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#ff899d"
green = "#9fe044"
yellow = "#faba4a"
blue = "#8db0ff"
magenta = "#c7a9ff"
cyan = "#a4daff"
white = "#c0caf5"
