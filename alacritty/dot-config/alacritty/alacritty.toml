[window]
decorations = "None"
dynamic_padding = true
padding = { x = 10, y = 10 }

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

# JetBrains Mono (ttf-jetbrains-mono)
[font]
size = 16
# extra space between lines, for reading prose
offset = { x = 0, y = 4 }

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.normal]
family = "JetBrains Mono"
style = "Regular"

# Tokyo Night accents on near-black, with off-white text: a little short of full contrast, easier on long sessions
[colors.primary]
background = "#141414"
foreground = "#e0e0e0"

[colors.cursor]
text = "#141414"
cursor = "#e0e0e0"

[colors.selection]
text = "CellForeground"
background = "#33467c"

[colors.normal]
black = "#0a0a0a"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#d4d4d4"

[colors.bright]
black = "#808080"   # the grey of secondary text (Claude Code, git, comments)
red = "#ff899d"
green = "#9fe044"
yellow = "#faba4a"
blue = "#8db0ff"
magenta = "#c7a9ff"
cyan = "#a4daff"
white = "#ffffff"
