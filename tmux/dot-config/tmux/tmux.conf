# Sensible tmux defaults. Kept in sync by hand with nixed's home.nix
# (programs.tmux), which targets the same effective config on the NixOS host.

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# vi-style keys in copy mode and the command prompt
setw -g mode-keys vi
set -g status-keys vi

# Windows/panes start at 1, not 0 - matches shell tab numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

# Split panes keeping the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g status-interval 5
set -g status-left-length 20
set -g status-left "#[bold]#S "
set -g status-right "%Y-%m-%d %H:%M"
set -g status-style "bg=colour234,fg=colour137"
setw -g window-status-current-style "bg=colour238,fg=colour81,bold"
