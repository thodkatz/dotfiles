# Named 99-* so it is parsed after any distro defaults (e.g. 70-synaptics.conf from
# xf86-input-synaptics); otherwise those can take over the touchpad and these options are ignored.
Section "InputClass"
    Identifier "libinput touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"   # 1-finger tap = left, 2-finger = right, 3-finger = middle
    Option "NaturalScrolling" "false" # traditional scrolling: two fingers down scrolls the page down
    Option "DisableWhileTyping" "true"
EndSection
