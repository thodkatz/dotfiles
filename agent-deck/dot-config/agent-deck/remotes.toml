# The laptop's guests, as fleet reaches them (agentvm@<ip>, over the tailnet; the key from ~/.ssh/config or the
# agent), one [remotes.<name>] each. Each has the same pinned agent-deck in ~/.local/bin, not on a non-login ssh's
# PATH. Only the laptop stows this file: a NixOS host's remotes.toml is written by nixed, from its own guests.
[remotes.thinkrepos]
  host = "agentvm@192.168.123.51"
  agent_deck_path = "/home/agentvm/.local/bin/agent-deck"

[remotes.repos]
  host = "agentvm@192.168.122.51"
  agent_deck_path = "/home/agentvm/.local/bin/agent-deck"
