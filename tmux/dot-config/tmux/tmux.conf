# One tmux config for the laptop and the NixOS hosts. Plugins load from
# plugins.tmux, sourced last: TPM's on the laptop (this package), Nix store
# paths on the hosts (generated by nixed's modules/home.nix). This file names
# neither, and works with no plugins at all.

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# alacritty's TERM is `alacritty`, which the override above misses; a recent
# tmux and alacritty find truecolor by asking the terminal, an older pair
# would round every #rrggbb below to the 256-colour palette without this.
set -ga terminal-features ",alacritty*:RGB"

# vi-style keys in copy mode and the command prompt
setw -g mode-keys vi
set -g status-keys vi

# Windows/panes start at 1, not 0 - matches shell tab numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix C-a, not tmux's C-b: an agent session attached from fleet's deck window
# is the guest's tmux, whose prefix stays C-b, so the two no longer collide.
# C-a C-a sends a literal C-a (a shell's start of line).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g set-clipboard on

set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

# Split panes keeping the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# fleet binds no key; an older config bound F (`fleet sync`), and a reload keeps a binding it no longer sets
unbind F

# vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Plugin options, read when plugins.tmux loads the plugins
set -g @sessionx-bind "f"
set -g @extrakto_key "tab"
set -g @continuum-save-interval "15"
# Leave fleet's sessions out of every save: a restore merges panes into
# sessions that exist, so a fleet session already up would get untagged
# shells and duplicate windows. fleet rebuilds its own. resurrect runs this
# with the save file's path appended; lines are tab-separated, session second.
set -g @resurrect-hook-post-save-layout 'sed -i -E "/^(pane|window)\tfleet(\t|-)/d"'

# Theme: gruvbox dark, set here rather than by a theme plugin, so the status
# line stays ours (fleet's hint) and the laptop and the hosts look the same.
# Palette: bg #282828, bg1 #3c3836, bg2 #504945, fg #ebdbb2, grey #928374,
# yellow #fabd2f, blue #83a598. fleet colours its hint's hosts.
set -g status-interval 5
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[bg=#fabd2f,fg=#282828,bold] #S #[default] "
# Single quotes: tmux would expand $HOME and $PATH inside double quotes at load.
set -g status-right '#(PATH="$HOME/.local/bin:$PATH" fleet hint -t "#{session_name}")  #[fg=#928374]%Y-%m-%d %H:%M '
# Tabs, herdr-style: a dim number, then the window name.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#928374] #I #[fg=#a89984]#W#{?window_zoomed_flag, +,} "
setw -g window-status-current-format "#[bg=#504945,fg=#928374] #I #[fg=#ebdbb2,bold]#W#{?window_zoomed_flag, +,} "
setw -g window-status-style default
setw -g window-status-current-style default   # tmux 3.8 defaults it to underscore
setw -g window-status-activity-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#ebdbb2"
setw -g clock-mode-colour "#83a598"

# Pane borders: the focused pane's in blue. On the border line, fleet's
# overview pane says so, its resources (btop) pane names its guest
# (@fleet-overview, @fleet-res-guest, set by fleet), every other pane shows its
# command and directory.
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"
set -g pane-border-format "#{?@fleet-res-guest,#[fg=#ebdbb2#,bold] #{@fleet-res-guest}#[nobold#,fg=#928374] resources ,#{?@fleet-overview,#[fg=#ebdbb2#,bold] overview ,#{pane_current_command} #[fg=#928374]#{b:pane_current_path} }}"

# Last: the plugins (continuum hooks status-right as it loads, so it must
# come after the status line above). -q: no plugins.tmux, no plugins.
source-file -q ~/.config/tmux/plugins.tmux
