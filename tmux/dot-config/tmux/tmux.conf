# One tmux config for the laptop and the NixOS hosts. Plugins load from
# plugins.tmux, sourced last: TPM's on the laptop (this package), Nix store
# paths on the hosts (generated by nixed's modules/home.nix). This file names
# neither, and works with no plugins at all.

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# alacritty's TERM is `alacritty`, which the override above misses; a recent
# tmux and alacritty find truecolor by asking the terminal, an older pair
# would round every #rrggbb below to the 256-colour palette without this.
set -ga terminal-features ",alacritty*:RGB"

# vi-style keys in copy mode and the command prompt
setw -g mode-keys vi
set -g status-keys vi

# Windows/panes start at 1, not 0 - matches shell tab numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g set-clipboard on

set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

# Split panes keeping the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# fleet (~/.local/bin/fleet): prefix F syncs the fleet session's panes, then
# shows what the sync did (or why it did not run) on the client that pressed
# it. Pressed in a shell pane ssh'd into a guest, after `claudes -d` there, that
# pane becomes the session's (-p). On the NixOS hosts ~/.local/bin is not on
# PATH, hence the prefix.
bind F display-message "fleet: syncing…" \; run-shell -b 'tmux display-message -c "#{client_name}" "$(PATH="$HOME/.local/bin:$PATH" fleet sync -t "#{session_name}" -p "#{pane_id}" 2>&1 | tail -n 1)"'

# Plugin options, read when plugins.tmux loads the plugins
set -g @sessionx-bind "f"
set -g @extrakto_key "tab"
set -g @continuum-save-interval "15"
# Leave fleet's sessions out of every save: a restore merges panes into
# sessions that exist, so a fleet session already up would get untagged
# shells and duplicate windows. fleet rebuilds its own. resurrect runs this
# with the save file's path appended; lines are tab-separated, session second.
set -g @resurrect-hook-post-save-layout 'sed -i -E "/^(pane|window)\tfleet(\t|-)/d"'

# Theme: gruvbox dark, set here rather than by a theme plugin, so the status
# line stays ours (fleet's hint) and the laptop and the hosts look the same.
# Palette: bg #282828, bg1 #3c3836, bg2 #504945, fg #ebdbb2, grey #928374,
# yellow #fabd2f, blue #83a598. fleet colours its own glyphs and hosts.
set -g status-interval 5
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[bg=#fabd2f,fg=#282828,bold] #S #[default] "
# Single quotes: tmux would expand $HOME and $PATH inside double quotes at load.
set -g status-right '#(PATH="$HOME/.local/bin:$PATH" fleet hint -t "#{session_name}")  #[fg=#928374]%Y-%m-%d %H:%M '
# Tabs, herdr-style: a dim number, then the window name; fleet's agent windows
# (named <repo>/<branch>) take their host's colour (@fleet-host-colour, set by fleet).
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#928374] #I #[fg=#{?@fleet-host-colour,#{@fleet-host-colour},#a89984}]#W#{?window_zoomed_flag, +,} "
setw -g window-status-current-format "#[bg=#504945,fg=#928374] #I #[fg=#{?@fleet-host-colour,#{@fleet-host-colour},#ebdbb2},bold]#W#{?window_zoomed_flag, +,} "
setw -g window-status-style default
setw -g window-status-current-style default   # tmux 3.8 defaults it to underscore
setw -g window-status-activity-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#ebdbb2"
setw -g clock-mode-colour "#83a598"

# Pane borders: the focused pane's in blue. On the border line, fleet's agent
# panes show their state's glyph, branch (none when unknown) and live value,
# then their window's host in its colour (@fleet-glyph, @fleet-branch,
# @fleet-live, @fleet-host, set by fleet; a pane tagged by an older fleet
# shows its entry until prefix F retags it), its overview panes their guest
# in its host's colour, the host and the guest's counts (@fleet-guest,
# @fleet-guest-colour, @fleet-guest-host, @fleet-summary), a resources (btop)
# pane its guest, `resources` and the host (@fleet-res-guest), every other pane its
# command and directory.
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"
set -g pane-border-format "#{?@fleet-entry,#{?@fleet-branch,#[fg=#{@fleet-colour}] #{@fleet-glyph} #{?#{==:#{@fleet-branch},?},,#[fg=#ebdbb2#,bold]#{@fleet-branch}#[nobold] }#[fg=#928374]#{@fleet-live}  #[fg=#{?@fleet-host-colour,#{@fleet-host-colour},#928374}]#{@fleet-host} , #{@fleet-entry} },#{?@fleet-guest,#[fg=#{?@fleet-guest-colour,#{@fleet-guest-colour},#ebdbb2}#,bold] #{@fleet-guest}#[nobold#,fg=#928374] #{@fleet-guest-host}  #{@fleet-summary} ,#{?@fleet-res-guest,#[fg=#{?@fleet-guest-colour,#{@fleet-guest-colour},#ebdbb2}#,bold] #{@fleet-res-guest}#[nobold#,fg=#928374] resources  #{@fleet-guest-host} , #{pane_current_command} #[fg=#928374]#{b:pane_current_path} }}}"

# Last: the plugins (continuum hooks status-right as it loads, so it must
# come after the status line above). -q: no plugins.tmux, no plugins.
source-file -q ~/.config/tmux/plugins.tmux
